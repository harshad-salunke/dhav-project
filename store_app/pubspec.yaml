name: store_app
description: DHAV Store Partner App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-104.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # State + storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_database: ^11.1.4
  google_sign_in: ^6.2.1

  # Notifications / alerts
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # Device
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # Maps
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
