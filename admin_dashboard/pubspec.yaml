name: admin_dashboard
description: DHAV Admin Dashboard (Flutter Web)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # State + Networking
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
